[project]
name = "medical-llm-eval-harness"
version = "0.1.0"
description = "Evaluation and regression harness for grounded medical LLM assistants"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
